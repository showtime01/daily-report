  # ──── 顧客マスタ ────────────────────────────────────────────
  /customers:
    get:
      tags: [customers]
      summary: 顧客一覧取得
      description: |
        - admin: 全件取得・検索可
        - sales: マスタ選択用に全件返す（検索不可）
      parameters:
        - name: company_name
          in: query
          description: 企業名（部分一致、admin のみ有効）
          schema:
            type: string
        - name: industry
          in: query
          description: 業種（部分一致、admin のみ有効）
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [customers]
      summary: 顧客登録
      description: 顧客を新規登録する（admin のみ）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags: [customers]
      summary: 顧客詳細取得
      description: 担当営業一覧を含む顧客詳細を取得する（admin のみ）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [customers]
      summary: 顧客更新
      description: 顧客情報を更新する（admin のみ）。sales 配列を送信した場合、既存の担当営業割り当てを置き換える
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [customers]
      summary: 顧客論理削除
      description: 顧客を論理削除する（admin のみ）
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──── 担当営業 ────────────────────────────────────────────
  /customers/{id}/sales:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    post:
      tags: [customer-sales]
      summary: 担当営業追加
      description: 担当営業を追加する（admin のみ）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSalesInput'
      responses:
        '201':
          description: 追加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSalesAssignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /customers/{id}/sales/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: userId
        in: path
        required: true
        schema:
          type: integer

    delete:
      tags: [customer-sales]
      summary: 担当営業削除
      description: 担当営業の割り当てを削除する（admin のみ）
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
